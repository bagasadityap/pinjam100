@if (show) {
  <div
    class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 px-4"
    (click)="close()"
  >
    <div
      class="w-full bg-white rounded-xl shadow-xl"
      [class.max-w-sm]="size === 'sm'"
      [class.max-w-md]="size === 'md'"
      [class.max-w-lg]="size === 'lg'"
      [class.max-w-4xl]="size === 'xl'"
      (click)="$event.stopPropagation()"
    >
      <div
        class="px-6 py-5 border-b border-gray-200 flex items-center justify-between"
      >
        <div>
          <h2 class="text-lg font-bold text-gray-900">
            {{ title }}
          </h2>

          @if (description) {
            <p class="text-sm text-gray-500 mt-1">
              {{ description }}
            </p>
          }
        </div>

        <button
          type="button"
          (click)="close()"
          class="text-gray-400 hover:text-gray-600 transition"
        >
          <i class="fa-solid fa-xmark text-xl"></i>
        </button>
      </div>

      <!-- Content -->
      <div class="px-6 py-6">
        <div class="flex items-start gap-4">
          <div
            class="w-10 h-10 shrink-0 rounded-full bg-green-50
                   flex items-center justify-center"
          >
            <i class="fa-solid fa-circle-check text-green-600"></i>
          </div>

          <div>
            <p class="text-sm font-semibold text-gray-900">
              Konfirmasi Verifikasi
            </p>

            <p class="text-sm text-gray-500 mt-1 leading-6">
              Apakah Anda yakin ingin memverifikasi data ini?
              Pastikan seluruh informasi telah diperiksa dengan benar.
            </p>
          </div>
        </div>

        <div class="mt-6">
          <label for="notes" class="block text-sm font-semibold text-gray-900">
            Catatan
          </label>

          <textarea
            id="notes"
            [(ngModel)]="notes"
            rows="4"
            placeholder="Masukkan catatan jika diperlukan..."
            class="mt-2 w-full rounded-lg border border-gray-300 px-3 py-2.5 text-sm text-gray-900 placeholder:text-gray-400 focus:border-gray-500 focus:outline-none focus:ring-1 focus:ring-gray-500 resize-none"
          ></textarea>
        </div>
      </div>

      <div
        class="px-6 py-4 border-t border-gray-200
              flex justify-end gap-3"
      >
        <button
          type="button"
          (click)="close()"
          class="px-5 py-2.5 rounded-lg text-sm font-semibold
                text-gray-700 bg-gray-100 hover:bg-gray-200 transition"
        >
          Batal
        </button>

        <button
          type="button"
          (click)="reject()"
          class="px-5 py-2.5 rounded-lg text-sm font-semibold
                text-red-600 bg-red-50 hover:bg-red-100 transition"
        >
          <i class="fa-solid fa-xmark mr-2"></i>
          Tolak
        </button>

        <button
          type="button"
          (click)="save()"
          class="px-5 py-2.5 rounded-lg text-sm font-semibold
                text-white bg-green-600 hover:bg-green-700 transition"
        >
          <i class="fa-solid fa-check mr-2"></i>
          Verifikasi
        </button>
      </div>
    </div>
  </div>
}
