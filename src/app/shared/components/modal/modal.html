@if (show) {
  <div
    class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 px-4"
    (click)="close()"
  >
    <div
      class="w-full bg-white rounded-xl shadow-xl"
      [class.max-w-sm]="size === 'sm'"
      [class.max-w-md]="size === 'md'"
      [class.max-w-lg]="size === 'lg'"
      [class.max-w-4xl]="size === 'xl'"
      (click)="$event.stopPropagation()"
    >
      <div class="px-6 py-5 border-b border-gray-200 flex items-center justify-between">
        <div>
          <h2 class="text-lg font-bold">{{ title }}</h2>

          @if (description) {
            <p class="text-sm text-gray-500 mt-1">
              {{ description }}
            </p>
          }
        </div>

        <button
          type="button"
          (click)="close()"
          class="text-gray-400 hover:text-gray-600 transition"
        >
          <i class="fa-solid fa-xmark text-xl"></i>
        </button>
      </div>

      <div class="px-6 py-6">
        <ng-content></ng-content>
      </div>

      <div class="px-6 py-4 border-t border-gray-200 flex justify-end gap-3">
        <button
          type="button"
          (click)="close()"
          class="px-5 py-2.5 rounded-lg text-sm font-semibold text-gray-700 bg-gray-100 hover:bg-gray-200 transition"
        >
          Batal
        </button>

        <button
          type="button"
          (click)="save()"
          class="px-5 py-2.5 rounded-lg text-sm font-semibold text-white bg-blue-700 hover:bg-blue-800 transition"
        >
          <i class="fa-solid fa-floppy-disk mr-2"></i>
          Simpan
        </button>
      </div>
    </div>
  </div>
}
