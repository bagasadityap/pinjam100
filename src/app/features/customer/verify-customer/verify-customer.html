<app-sidebar></app-sidebar>

<main class="ml-64 min-h-screen bg-gray-100 text-gray-900">
  <header class="h-20 bg-white border-b border-gray-200 px-8 flex items-center justify-between">
    <div>
      <h1 class="text-xl font-bold">Customer</h1>
      <p class="text-sm text-gray-500 mt-1">Kelola data customer.</p>
    </div>
  </header>

  <div class="p-8">
    <div class="bg-white border border-gray-200 rounded-xl overflow-hidden">
      <div class="px-6 py-5 border-b border-gray-200 flex items-center justify-between">
        <div>
          <h2 class="font-bold text-lg">Daftar Customer</h2>
          <p class="text-sm text-gray-500 mt-1">Daftar csutomer yang belum dilakukan verifikasi</p>
        </div>
      </div>

      <div class="px-6 py-4">
        @if (loading()) {
          <div class="py-10 text-center text-sm text-gray-500">
            Memuat data customer...
          </div>
        } @else {
          <app-datatable
            tableId="customerTable"
            [data]="customers()"
            [columns]="columns"
            (action)="handleAction($event)"
          ></app-datatable>
        }
      </div>
    </div>
  </div>
</main>
