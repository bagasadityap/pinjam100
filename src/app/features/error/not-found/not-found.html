<main class="min-h-[calc(100vh-80px)] bg-white text-gray-900 overflow-hidden font-manrope relative flex items-center">

  <!-- Background -->
  <div class="absolute inset-0 bg-linear-to-br from-white via-white to-blue-50/60"></div>
  <div class="absolute -top-32 -right-32 w-125 h-125 bg-blue-100/60 rounded-full blur-3xl"></div>
  <div class="absolute -bottom-32 -left-32 w-100 h-100 bg-yellow-100/40 rounded-full blur-3xl"></div>

  <!-- Content -->
  <section class="relative z-10 w-full">
    <div class="max-w-7xl mx-auto px-6 py-20">

      <div class="grid lg:grid-cols-2 items-center gap-12">

        <!-- Text -->
        <div class="max-w-xl">

          <span class="inline-flex items-center px-4 py-2 rounded-full bg-blue-50 text-blue-700 text-sm font-bold tracking-wide">
            404 • Halaman Tidak Ditemukan
          </span>

          <h1 class="mt-6 text-6xl sm:text-7xl lg:text-8xl font-poppins font-bold tracking-tight leading-none text-gray-950">
            Oops!
          </h1>

          <h2 class="mt-4 text-3xl lg:text-4xl font-bold tracking-tight text-gray-900">
            Halaman yang Anda cari tidak ditemukan.
          </h2>

          <p class="mt-5 text-base lg:text-lg leading-8 text-gray-500 max-w-lg">
            Halaman mungkin sudah dipindahkan, dihapus, atau alamat yang Anda masukkan tidak sesuai.
            Jangan khawatir, Anda dapat kembali ke halaman sebelumnya.
          </p>

          <div class="mt-8">
            <button
              type="button"
              (click)="back()"
              class="inline-flex items-center justify-center gap-3 bg-blue-700 hover:bg-blue-800 text-white font-bold px-7 py-4 rounded-xl shadow-lg shadow-blue-700/20 transition-all duration-200 hover:-translate-y-1"
            >
              <i class="fa-solid fa-arrow-left"></i>
              Kembali
            </button>
          </div>

        </div>

        <!-- Illustration -->
        <div class="relative flex items-center justify-center">

          <div class="absolute w-100 h-100 bg-blue-100/60 rounded-full blur-3xl"></div>

          <div class="relative flex items-center justify-center">

            <div class="absolute w-72 h-72 lg:w-96 lg:h-96 rounded-full bg-blue-50 border border-blue-100"></div>

            <div class="relative z-10 text-center">

              <div class="text-[9rem] lg:text-[12rem] font-poppins font-extrabold leading-none text-blue-700/10">
                404
              </div>

              <div class="absolute inset-0 flex items-center justify-center">
                <div class="w-28 h-28 lg:w-36 lg:h-36 rounded-3xl bg-white border border-gray-100 shadow-xl flex items-center justify-center rotate-3">
                  <i class="fa-solid fa-file-circle-question text-blue-700 text-5xl lg:text-6xl"></i>
                </div>
              </div>

            </div>

          </div>

        </div>

      </div>

    </div>
  </section>

</main>
